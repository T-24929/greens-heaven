project_id = "greens-heaven"

[auth]
minimum_password_length = 6

[auth.email.template.invite]
subject = "Your Greens Heaven account is ready"
content_path = "./supabase/templates/invite.html"

[auth.email.template.confirmation]
subject = "Confirm your Greens Heaven account"
content_path = "./supabase/templates/confirm-signup.html"

[auth.email.template.magic_link]
subject = "Your Greens Heaven sign-in link"
content_path = "./supabase/templates/magic-link.html"

[auth.email.template.recovery]
subject = "Your Greens Heaven password reset code"
content_path = "./supabase/templates/reset-password.html"

[functions.send-reservation-email]
verify_jwt = true

[functions.send-account-setup]
verify_jwt = true
